# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - ISII2627aCodeLab

on:
  push:
    branches:
      - 'JuanAntonio-ContinousDelivery'
  
  pull_request:
    branches:
      - 'development'
    # paths:
    #   - 'src/AppForSEII.API**'
    types:
      - closed

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    env: #añadido3
      API: ./src/AppForSEII.API/AppForSEII.API.csproj

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'

      - name: Restore dependencies #AÑADIDO1
        run: dotnet restore ${{ env.API }}

      - name: Build with dotnet #AÑADIDO2
        run: dotnet build ${{ env.API }} --configuration Release --no-restore  


      - name: dotnet publish
        run: dotnet publish ${{ env.API }} -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build

    # AÑADIDO: Condición para que solo despliegue si se fusiona la PR
    if: github.event.pull_request.merged == true
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ISII2627aCodeLab'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_A6858C2EE3ED4932B9AA7BD6AEE6E296 }}